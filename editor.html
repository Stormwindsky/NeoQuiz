<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NeoQuiz Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #8b5cf6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; padding: 20px; }
        .editor-container { max-width: 800px; margin: auto; background: var(--card); padding: 30px; border-radius: 20px; }
        .q-block { background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid var(--accent); animation: fadeIn 0.3s ease; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: white; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .save-btn { background: #22c55e; color: white; width: 100%; font-size: 1.2rem; margin-top: 20px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="editor-container">
        <a href="index.html" style="color: #94a3b8; text-decoration: none;">← Back to Menu</a>
        <h2>NeoQuiz Editor</h2>
        <div id="questions-list"></div>
        <button class="btn" style="background: var(--accent); color: white;" onclick="addQuestion()">+ Add Question</button>
        <button class="save-btn btn" onclick="exportNQ()">DOWNLOAD .NQ FILE</button>
    </div>

    <script>
        function addQuestion() {
            const id = Date.now();
            const html = `
                <div class="q-block" id="q-${id}">
                    <div style="display:flex; gap:10px">
                        <select class="q-type"><option value="quiz">Quiz</option><option value="tf">True/False</option><option value="puzzle">Puzzle</option><option value="slider">Slider</option></select>
                        <select class="q-time"><option value="0">No Limit (Infinite)</option><option value="5">5s</option><option value="10">10s</option><option value="20">20s</option><option value="30">30s</option><option value="60">1m</option></select>
                    </div>
                    <input type="text" placeholder="Question Text" class="q-text">
                    <input type="text" placeholder="Media URL (Image/Video)" class="q-media">
                    <input type="text" placeholder="Option 1" class="opt"> <input type="text" placeholder="Option 2" class="opt">
                    <input type="text" placeholder="Option 3" class="opt"> <input type="text" placeholder="Option 4" class="opt">
                    <input type="text" placeholder="Correct Answer (Index or Value)" class="correct">
                    <button onclick="this.parentElement.remove()" style="background:#ef4444; color:white; border:none; border-radius:5px; padding:5px 10px; cursor:pointer; margin-top:10px;">Delete</button>
                </div>`;
            document.getElementById('questions-list').insertAdjacentHTML('beforeend', html);
        }

        async function exportNQ() {
            const list = [];
            document.querySelectorAll('.q-block').forEach(block => {
                list.push({
                    type: block.querySelector('.q-type').value,
                    time: parseInt(block.querySelector('.q-time').value),
                    question: block.querySelector('.q-text').value,
                    media: block.querySelector('.q-media').value,
                    options: Array.from(block.querySelectorAll('.opt')).map(o => o.value).filter(v => v !== ""),
                    answer: block.querySelector('.correct').value
                });
            });
            const zip = new JSZip();
            zip.file("quiz.json", JSON.stringify(list));
            zip.folder("Customs");
            const content = await zip.generateAsync({type:"blob"});
            const dl = document.createElement('a');
            dl.href = URL.createObjectURL(content);
            dl.download = "quiz_package.NQ";
            dl.click();
        }
        addQuestion();
    </script>
</body>
</html>
