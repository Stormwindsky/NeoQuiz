<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="page-title">NeoQuiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #8b5cf6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .menu { background: var(--card); padding: 3rem; border-radius: 30px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 400px; }
        h1 { font-size: 3rem; margin-bottom: 2rem; color: var(--accent); }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; text-decoration: none; font-size: 1.1rem; }
        .btn-play { background: var(--accent); color: white; }
        .btn-edit { background: #334155; color: white; }
        .lang-select { margin-top: 20px; background: transparent; color: white; border: 1px solid var(--accent); padding: 5px 10px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="menu">
        <h1 id="main-title">NeoQuiz</h1>
        <a href="game.html" class="btn btn-play" id="btn-play">PLAY / HOST</a>
        <a href="editor.html" class="btn btn-edit" id="btn-create">CREATE QUIZ (.NQ)</a>
        <select class="lang-select" id="langSwitcher" onchange="changeLang(this.value)">
            <option value="en">English</option>
            <option value="fr">Français</option>
        </select>
    </div>

    <script>
        function changeLang(lang) {
            localStorage.setItem('neoquiz_lang', lang);
            updateText();
        }

        function updateText() {
            const lang = localStorage.getItem('neoquiz_lang') || 'en';
            document.getElementById('langSwitcher').value = lang;
            if(lang === 'fr') {
                document.getElementById('page-title').innerText = "NéoQuiz";
                document.getElementById('main-title').innerText = "NéoQuiz";
                document.getElementById('btn-play').innerText = "JOUER / HÔTE";
                document.getElementById('btn-create').innerText = "CRÉER UN QUIZ (.NQ)";
            } else {
                document.getElementById('page-title').innerText = "NeoQuiz";
                document.getElementById('main-title').innerText = "NeoQuiz";
                document.getElementById('btn-play').innerText = "PLAY / HOST";
                document.getElementById('btn-create').innerText = "CREATE QUIZ (.NQ)";
            }
        }
        updateText();
    </script>
</body>
</html>
