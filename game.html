<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoQuiz - Game</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --accent: #8b5cf6; --success: #22c55e; --orange: #f97316;
            --red: #ef4444; --blue: #3b82f6; --yellow: #f59e0b; --green: #10b981;
        }
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 600px; width: 90%; margin: 50px auto; background: var(--card); padding: 2.5rem; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); text-align: center; position: relative;}
        .hidden { display: none !important; }
        input[type="text"] { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }
        .back-link { color: white; text-decoration: none; position: absolute; top: 20px; left: 20px; font-weight: 600; }
        #room-badge { background: var(--success); color: white; padding: 5px 15px; border-radius: 8px; font-weight: bold; margin: 10px 0; display: inline-block; }
        .quiz-grid { display: grid; gap: 15px; margin-top: 20px; }
        .grid-4 { grid-template-columns: 1fr 1fr; }
        .grid-2 { grid-template-columns: 1fr; }
        .answer-btn { min-height: 80px; padding: 10px; border-radius: 16px; border: none; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.1rem; }
        .b-1 { background: var(--red); } .b-2 { background: var(--blue); }
        .b-3 { background: var(--yellow); } .b-4 { background: var(--green); }
        .sortable-item { background: #334155; margin: 8px 0; padding: 15px; border-radius: 10px; cursor: grab; font-weight: bold; }
        .stat-bar-container { background: #0f172a; height: 25px; border-radius: 12px; margin: 8px 0; overflow: hidden; }
        .stat-bar { height: 100%; background: var(--accent); width: 0%; }
        #media-container { width: 100%; max-height: 180px; margin-bottom: 15px; border-radius: 12px; overflow: hidden; }
        #media-container img, #media-container video { width: 100%; height: 100%; object-fit: contain; }
        .feedback-screen { position: absolute; inset: 0; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .f-correct { background: var(--success); } .f-partial { background: var(--orange); } .f-wrong { background: var(--red); }
        .podium-item { padding: 15px; margin: 10px 0; border-radius: 12px; background: #334155; display: flex; justify-content: space-between; font-weight: 800; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>

    <div id="screen-home" class="container">
        <h2>Game Mode</h2>
        <button class="btn btn-primary" onclick="initHost()">HOST (Teacher)</button>
        <div style="margin: 20px 0; opacity: 0.3;">—</div>
        <input type="text" id="join-id" placeholder="Room Code">
        <input type="text" id="player-name" placeholder="Your Name">
        <button class="btn btn-success" onclick="initPlayer()">JOIN</button>
    </div>

    <div id="screen-lobby" class="container hidden">
        <h2>Lobby</h2>
        <div id="host-controls" class="hidden">
            <div id="room-badge">...</div>
            <input type="file" id="file-input" accept=".NQ,.json">
        </div>
        <div id="player-list"></div>
        <button id="start-btn" class="btn btn-primary hidden" onclick="startQuiz()">Launch Quiz 🚀</button>
    </div>

    <div id="screen-quiz" class="container hidden">
        <div id="timer-display" style="font-size: 2rem; font-weight: 800; color: var(--yellow);"></div>
        <div id="media-container"></div>
        <div id="host-view" class="hidden">
            <h2 id="q-text">Question</h2>
            <div id="live-stats" class="hidden"></div>
            <div id="answer-count-ui">
                <div style="font-size: 3rem;" id="answer-count">0</div>
                <p>Answers received</p>
            </div>
            <button id="next-btn" class="btn btn-success hidden" onclick="handleNextClick()">Next ➔</button>
        </div>
        <div id="player-view" class="hidden">
            <div id="interactive-area"></div>
            <button id="submit-ans" class="btn btn-primary hidden" onclick="submitInteraction()">Submit</button>
        </div>
        <div id="feedback" class="feedback-screen hidden">
            <h1 id="feedback-text">CORRECT!</h1>
        </div>
        <div id="podium" class="hidden">
            <h2>🏆 Final Results</h2>
            <div id="podium-list"></div>
            <button class="btn btn-primary" onclick="location.reload()">Finish</button>
        </div>
    </div>

    <script>
        let peer, conn, connections = [], quizData = [], currentQ = 0, players = {}, answersReceived = 0, timerInterval;
        const shapes = ['▲', '◆', '●', '■'];

        function initHost() {
            peer = new Peer();
            peer.on('open', id => { document.getElementById('room-badge').innerText = id; showScreen('screen-lobby'); document.getElementById('host-controls').classList.remove('hidden'); });
            peer.on('connection', c => {
                c.on('open', () => {
                    c.on('data', d => {
                        if(d.type === 'JOIN') { players[c.peer] = {name: d.name, score: 0}; connections.push(c); updateLobby(); }
                        if(d.type === 'ANSWER') handleAnswer(c.peer, d.value);
                    });
                    c.on('close', () => { connections = connections.filter(conn => conn.peer !== c.peer); updateLobby(); });
                });
            });
            document.getElementById('file-input').onchange = (e) => {
                const r = new FileReader();
                r.onload = (v) => { quizData = JSON.parse(v.target.result); updateLobby(); };
                r.readAsText(e.target.files[0]);
            };
        }

        function updateLobby() {
            document.getElementById('player-list').innerHTML = Object.values(players).map(p => `<span style="background:#334155;padding:5px 10px;border-radius:20px;margin:5px;display:inline-block">${p.name}</span>`).join('');
            const btn = document.getElementById('start-btn');
            if(connections.length > 0 && quizData.length > 0) btn.classList.remove('hidden');
            else btn.classList.add('hidden');
        }

        function initPlayer() {
            const id = document.getElementById('join-id').value;
            const name = document.getElementById('player-name').value;
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(id);
                conn.on('open', () => {
                    conn.send({type:'JOIN', name: name});
                    showScreen('screen-lobby');
                });
                conn.on('data', d => {
                    if(d.type === 'START_Q') renderPlayerUI(d.qData);
                    if(d.type === 'RESULT') showFeedback(d.status);
                    if(d.type === 'END') alert("Game Finished!");
                });
            });
        }

        function startQuiz() { showScreen('screen-quiz'); document.getElementById('host-view').classList.remove('hidden'); showQuestion(); }

        function showQuestion() {
            answersReceived = 0;
            document.getElementById('answer-count').innerText = "0";
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('live-stats').classList.add('hidden');
            document.getElementById('answer-count-ui').classList.remove('hidden');
            const q = quizData[currentQ];
            document.getElementById('q-text').innerText = q.question;
            handleMedia(q.media);
            broadcast({type: 'START_Q', qData: q});
            startTimer(q.time, true);
        }

        function handleAnswer(pId, val) {
            players[pId].lastAnswer = val;
            answersReceived++;
            document.getElementById('answer-count').innerText = answersReceived;
            if(answersReceived >= connections.length) endQuestion();
        }

        function endQuestion() {
            clearInterval(timerInterval);
            const q = quizData[currentQ];
            const stats = {};
            connections.forEach(c => {
                const p = players[c.peer];
                let status = (String(p.lastAnswer) === String(q.answer)) ? "correct" : "wrong";
                if(status === "correct") p.score += 100;
                c.send({type: 'RESULT', status: status});
                stats[p.lastAnswer] = (stats[p.lastAnswer] || 0) + 1;
            });
            showHostStats(stats);
        }

        function showHostStats(stats) {
            document.getElementById('answer-count-ui').classList.add('hidden');
            const statsDiv = document.getElementById('live-stats');
            statsDiv.classList.remove('hidden');
            statsDiv.innerHTML = '<h3>Results</h3>';
            const q = quizData[currentQ];
            if(q.type === 'quiz' || q.type === 'tf') {
                q.options.forEach((opt, i) => {
                    const pct = Math.round(((stats[i] || 0) / connections.length) * 100) || 0;
                    const isCorrect = String(q.answer).includes(String(i));
                    statsDiv.innerHTML += `<div style="text-align:left; margin:5px 0;">${isCorrect ? '✅ ' : ''}${opt} (${pct}%)<div class="stat-bar-container"><div class="stat-bar" style="width:${pct}%"></div></div></div>`;
                });
            } else { statsDiv.innerHTML += `<p>Correct: <b>${q.answer}</b></p>`; }
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function handleNextClick() {
            currentQ++;
            if(currentQ < quizData.length) showQuestion();
            else showPodium();
        }

        function showPodium() {
            document.getElementById('host-view').classList.add('hidden');
            document.getElementById('podium').classList.remove('hidden');
            const sorted = Object.values(players).sort((a,b) => b.score - a.score).slice(0, 3);
            document.getElementById('podium-list').innerHTML = sorted.map((p, i) => `<div class="podium-item"><span>#${i+1} ${p.name}</span><span>${p.score} pts</span></div>`).join('');
            broadcast({type: 'END'});
        }

        function renderPlayerUI(q) {
            showScreen('screen-quiz'); document.getElementById('player-view').classList.remove('hidden');
            document.getElementById('feedback').classList.add('hidden');
            const area = document.getElementById('interactive-area');
            const submitBtn = document.getElementById('submit-ans');
            area.innerHTML = ''; submitBtn.classList.add('hidden');
            handleMedia(q.media);
            if(q.type === 'quiz' || q.type === 'tf') {
                const grid = document.createElement('div'); grid.className = q.options.length <= 2 ? "quiz-grid grid-2" : "quiz-grid grid-4";
                q.options.forEach((opt, i) => { grid.innerHTML += `<button class="answer-btn b-${i+1}" onclick="handlePlayerClick(${i})"><span>${shapes[i]}</span><span>${opt}</span></button>`; });
                area.appendChild(grid);
            } else if(q.type === 'puzzle') {
                submitBtn.classList.remove('hidden');
                const list = document.createElement('ul'); list.id = 'puzzle-sort';
                q.options.forEach((opt, i) => { list.innerHTML += `<li class="sortable-item" data-id="${i}">${opt}</li>`; });
                area.appendChild(list); new Sortable(list, {animation: 150});
            }
        }

        function handlePlayerClick(idx) { conn.send({type: 'ANSWER', value: idx}); document.getElementById('player-view').classList.add('hidden'); }
        function submitInteraction() {
            const val = Array.from(document.getElementById('puzzle-sort').children).map(li => li.dataset.id).join(',');
            conn.send({type: 'ANSWER', value: val}); document.getElementById('player-view').classList.add('hidden');
        }
        function showFeedback(status) {
            const fb = document.getElementById('feedback'); fb.className = "feedback-screen f-" + status;
            document.getElementById('feedback-text').innerText = status.toUpperCase();
            fb.classList.remove('hidden');
        }
        function startTimer(seconds, isHost) {
            clearInterval(timerInterval);
            if(seconds <= 0) { document.getElementById('timer-display').innerText = "∞"; return; }
            let t = seconds;
            timerInterval = setInterval(() => {
                t--; document.getElementById('timer-display').innerText = t;
                if(t <= 0) { clearInterval(timerInterval); if(isHost && answersReceived < connections.length) endQuestion(); }
            }, 1000);
        }
        function handleMedia(url) {
            const mc = document.getElementById('media-container'); mc.innerHTML = ''; if(!url) return;
            if(url.match(/\.(mp4|webm)$/)) mc.innerHTML = `<video src="${url}" autoplay loop muted></video>`;
            else if(url.match(/\.(mp3|wav)$/)) mc.innerHTML = `<audio src="${url}" autoplay controls></audio>`;
            else mc.innerHTML = `<img src="${url}">`;
        }
        function showScreen(id) { document.querySelectorAll('.container').forEach(c => c.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function broadcast(d) { connections.forEach(c => c.send(d)); }
    </script>
</body>
</html>
