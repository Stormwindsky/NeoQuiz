<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoQuiz - Game</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --accent: #8b5cf6; --success: #22c55e; --red: #ef4444; 
            --blue: #3b82f6; --yellow: #f59e0b; --green: #10b981; --orange: #f97316;
        }
        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        .container { max-width: 600px; width: 90%; margin: 50px auto; background: var(--card); padding: 2.5rem; border-radius: 24px; text-align: center; animation: slideIn 0.5s ease; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }
        .quiz-grid { display: grid; gap: 15px; margin-top: 20px; }
        .grid-4 { grid-template-columns: 1fr 1fr; }
        .answer-btn { min-height: 80px; border-radius: 16px; border: none; color: white; font-weight: 700; cursor: pointer; animation: pop 0.4s ease; }
        .b-1 { background: var(--red); } .b-2 { background: var(--blue); } .b-3 { background: var(--yellow); } .b-4 { background: var(--green); }
        .stat-bar-container { background: #0f172a; height: 20px; border-radius: 10px; margin: 8px 0; overflow: hidden; border: 1px solid #334155; }
        .stat-bar { height: 100%; background: var(--accent); width: 0; transition: width 1s ease; }
        .feedback-screen { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 24px; animation: fadeIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="screen-home" class="container">
        <h1>NeoQuiz</h1>
        <button class="btn btn-primary" onclick="initHost()">HOST (Teacher)</button>
        <div style="margin: 20px 0; opacity: 0.2;">—</div>
        <input type="text" id="join-id" placeholder="Room Code" style="width:100%; padding:12px; border-radius:8px; border:none; margin-bottom:10px; background:#0f172a; color:white;">
        <input type="text" id="player-name" placeholder="Your Name" style="width:100%; padding:12px; border-radius:8px; border:none; background:#0f172a; color:white;">
        <button class="btn btn-success" onclick="initPlayer()">JOIN</button>
    </div>

    <div id="screen-lobby" class="container hidden">
        <h2>Lobby</h2>
        <div id="host-controls" class="hidden">
            <div id="room-badge" style="background:var(--success); padding:8px 20px; border-radius:10px; display:inline-block; margin-bottom:20px; font-weight:800;">...</div>
            <p>Upload your .NQ Package</p>
            <input type="file" id="file-input" accept=".NQ">
        </div>
        <div id="player-list" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:20px 0;"></div>
        <button id="start-btn" class="btn btn-primary hidden" onclick="startQuiz()">Launch Quiz 🚀</button>
    </div>

    <div id="screen-quiz" class="container hidden">
        <div id="timer-display" style="font-size: 2.5rem; font-weight: 900; color: var(--yellow); text-shadow: 0 4px 10px rgba(0,0,0,0.3);"></div>
        <div id="media-container" style="margin: 15px 0;"></div>
        <div id="host-view" class="hidden">
            <h2 id="q-text">Question</h2>
            <div id="live-stats" class="hidden"></div>
            <div id="answer-count-ui"><div style="font-size: 4rem; font-weight: 900;" id="answer-count">0</div><p>Players Answered</p></div>
            <button id="next-btn" class="btn btn-success hidden" onclick="handleNext()">Next ➔</button>
        </div>
        <div id="player-view" class="hidden"><div id="interactive-area"></div><button id="submit-btn" class="btn btn-primary hidden" onclick="submitInteraction()">Submit</button></div>
        <div id="feedback" class="feedback-screen hidden"></div>
        <div id="podium" class="hidden"><h2>🏆 Final Podium</h2><div id="podium-list"></div><button class="btn btn-primary" onclick="location.reload()">Finish</button></div>
    </div>

    <script>
        let peer, conn, connections = [], quizData = [], currentQ = 0, players = {}, answersReceived = 0, timerInterval;
        let lobbyMusic = new Audio(), quizMusic = new Audio();

        async function loadNQ(file) {
            const zip = await JSZip.loadAsync(file);
            quizData = JSON.parse(await zip.file("quiz.json").async("string"));
            const customs = zip.folder("Customs");
            
            const hostFile = Object.keys(zip.files).find(f => f.toLowerCase().includes("customs/host."));
            const quizFile = Object.keys(zip.files).find(f => f.toLowerCase().includes("customs/quiz."));
            
            lobbyMusic.src = hostFile ? URL.createObjectURL(await zip.file(hostFile).async("blob")) : "./Audios/Host.mp3";
            quizMusic.src = quizFile ? URL.createObjectURL(await zip.file(quizFile).async("blob")) : "./Audios/Quiz.mp3";
            
            lobbyMusic.loop = true; quizMusic.loop = true;
            lobbyMusic.play().catch(()=>{});
            updateLobby();
        }

        function initHost() {
            peer = new Peer();
            peer.on('open', id => { document.getElementById('room-badge').innerText = id; showScreen('screen-lobby'); document.getElementById('host-controls').classList.remove('hidden'); });
            peer.on('connection', c => {
                c.on('open', () => {
                    c.on('data', d => {
                        if(d.type === 'JOIN') { players[c.peer] = {name: d.name, score: 0}; connections.push(c); updateLobby(); }
                        if(d.type === 'ANSWER') handleAnswer(c.peer, d.value);
                    });
                    c.on('close', () => { connections = connections.filter(x => x.peer !== c.peer); updateLobby(); });
                });
            });
            document.getElementById('file-input').onchange = e => loadNQ(e.target.files[0]);
        }

        function updateLobby() {
            document.getElementById('player-list').innerHTML = Object.values(players).map(p => `<span style="background:var(--accent); padding:8px 15px; border-radius:20px; font-weight:600;">${p.name}</span>`).join('');
            const btn = document.getElementById('start-btn');
            (connections.length > 0 && quizData.length > 0) ? btn.classList.remove('hidden') : btn.classList.add('hidden');
        }

        function startQuiz() { lobbyMusic.pause(); quizMusic.play().catch(()=>{}); showScreen('screen-quiz'); document.getElementById('host-view').classList.remove('hidden'); showQuestion(); }

        function showQuestion() {
            answersReceived = 0; document.getElementById('answer-count').innerText = "0";
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('live-stats').classList.add('hidden');
            document.getElementById('answer-count-ui').classList.remove('hidden');
            const q = quizData[currentQ];
            document.getElementById('q-text').innerText = q.question;
            handleMedia(q.media);
            broadcast({type: 'START_Q', qData: q});
            startTimer(q.time);
        }

        function handleAnswer(pId, val) {
            players[pId].lastAnswer = val;
            answersReceived++;
            document.getElementById('answer-count').innerText = answersReceived;
            if(answersReceived >= connections.length) endQuestion();
        }

        function endQuestion() {
            clearInterval(timerInterval);
            const q = quizData[currentQ];
            connections.forEach(c => {
                const p = players[c.peer];
                const isCorrect = String(p.lastAnswer) === String(q.answer);
                if(isCorrect) p.score += 100;
                c.send({type: 'RESULT', status: isCorrect ? 'correct' : 'wrong'});
            });
            showHostStats();
        }

        function showHostStats() {
            document.getElementById('answer-count-ui').classList.add('hidden');
            const statsDiv = document.getElementById('live-stats'); statsDiv.classList.remove('hidden');
            const q = quizData[currentQ];
            statsDiv.innerHTML = '<h3>Results</h3>';
            if(q.options && q.type !== 'slider') {
                q.options.forEach((opt, i) => {
                    const count = Object.values(players).filter(p => String(p.lastAnswer) === String(i)).length;
                    const pct = Math.round((count / connections.length) * 100) || 0;
                    const correct = String(q.answer).includes(i);
                    statsDiv.innerHTML += `<div style="text-align:left; margin-bottom:10px;">${correct?'✅':''} ${opt} (${pct}%)<div class="stat-bar-container"><div class="stat-bar" style="width:${pct}%"></div></div></div>`;
                });
            } else { statsDiv.innerHTML += `<p>Correct Answer: <b>${q.answer}</b></p>`; }
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function handleNext() { currentQ++; (currentQ < quizData.length) ? showQuestion() : finishGame(); }

        function finishGame() { quizMusic.pause(); document.getElementById('host-view').classList.add('hidden'); document.getElementById('podium').classList.remove('hidden'); const sorted = Object.values(players).sort((a,b)=>b.score-a.score).slice(0,3); document.getElementById('podium-list').innerHTML = sorted.map((p,i)=>`<div style="background:#334155; padding:15px; margin:10px; border-radius:12px; font-weight:800; display:flex; justify-content:space-between;"><span>#${i+1} ${p.name}</span><span>${p.score} pts</span></div>`).join(''); broadcast({type:'END'}); }

        // Player Logic
        function initPlayer() {
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(document.getElementById('join-id').value);
                conn.on('open', () => { conn.send({type:'JOIN', name: document.getElementById('player-name').value}); showScreen('screen-lobby'); });
                conn.on('data', d => {
                    if(d.type === 'START_Q') renderPlayerUI(d.qData);
                    if(d.type === 'RESULT') showFeedback(d.status);
                });
            });
        }

        function renderPlayerUI(q) {
            showScreen('screen-quiz'); document.getElementById('player-view').classList.remove('hidden'); document.getElementById('feedback').classList.add('hidden');
            const area = document.getElementById('interactive-area'); area.innerHTML = '';
            document.getElementById('submit-btn').classList.add('hidden');
            handleMedia(q.media);
            if(q.type === 'quiz' || q.type === 'tf') {
                const grid = document.createElement('div'); grid.className = "quiz-grid grid-4";
                q.options.forEach((opt, i) => { grid.innerHTML += `<button class="answer-btn b-${i+1}" onclick="sendAnswer(${i})">${opt}</button>`; });
                area.appendChild(grid);
            } else if(q.type === 'puzzle') {
                document.getElementById('submit-btn').classList.remove('hidden');
                area.innerHTML = '<ul id="sortable" style="list-style:none; padding:0;">' + q.options.map((o,i)=>`<li class="btn b-2" style="margin:5px; cursor:grab;" data-id="${i}">${o}</li>`).join('') + '</ul>';
                new Sortable(document.getElementById('sortable'), {animation: 150});
            }
        }

        function sendAnswer(v) { conn.send({type:'ANSWER', value:v}); document.getElementById('player-view').classList.add('hidden'); }
        function submitInteraction() { const val = Array.from(document.getElementById('sortable').children).map(li=>li.dataset.id).join(','); sendAnswer(val); }

        function showFeedback(status) {
            const fb = document.getElementById('feedback'); fb.classList.remove('hidden');
            fb.style.background = status === 'correct' ? 'var(--success)' : 'var(--red)';
            fb.innerHTML = `<h1>${status === 'correct' ? 'CORRECT ! 🚀' : 'WRONG ! ❌'}</h1>`;
        }

        function startTimer(sec) {
            clearInterval(timerInterval);
            if(sec <= 0) { document.getElementById('timer-display').innerText = "∞"; return; }
            let t = sec; document.getElementById('timer-display').innerText = t;
            timerInterval = setInterval(() => {
                t--; document.getElementById('timer-display').innerText = t;
                if(t <= 0) { clearInterval(timerInterval); endQuestion(); }
            }, 1000);
        }

        function handleMedia(url) {
            const mc = document.getElementById('media-container'); mc.innerHTML = ''; if(!url) return;
            if(url.match(/\.(mp4|webm)$/)) mc.innerHTML = `<video src="${url}" autoplay loop muted style="width:100%; border-radius:12px;"></video>`;
            else mc.innerHTML = `<img src="${url}" style="width:100%; border-radius:12px;">`;
        }

        function showScreen(id) { document.querySelectorAll('.container').forEach(c => c.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function broadcast(d) { connections.forEach(c => c.send(d)); }
    </script>
</body>
</html>
